{% extends "base.html" %}
{% block title %}Log in · Study Tracker{% endblock %}
{% block content %}
<section class="panel auth-panel">
<p class="eyebrow">A little progress, every day</p>
<h2>Log in</h2>
<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" maxlength="254" required value="{{ request.form.get('email', '') }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" maxlength="128" required>
  <button type="submit">Log in</button>
</form>
<p><a href="{{ url_for('register') }}">Create an account</a></p>
</section>
{% endblock %}
